<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Apply the theme before first paint — no dark-mode white flash.
      // React reads the same values and stays the source of truth after mount.
      (function () {
        var theme = null;
        try {
          theme = localStorage.getItem("csvjson-theme");
        } catch (e) {
          /* private mode — fall through to OS preference */
        }
        if (theme !== "dark" && theme !== "light") {
          try {
            theme = window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
          } catch (e) {
            theme = "light";
          }
        }
        if (theme === "dark") {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
    <title>CSV to JSON Converter — CSVJSON</title>
    <meta
      name="description"
      content="Convert CSV to JSON and JSON to CSV right in your browser. Supports TSV and semicolon separators, quoted fields, and Unicode — nothing ever leaves your browser."
    />
    <link rel="canonical" href="https://www.csvjson.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CSVJSON" />
    <meta property="og:title" content="CSV to JSON Converter — CSVJSON" />
    <meta
      property="og:description"
      content="Convert CSV to JSON and JSON to CSV right in your browser. Supports TSV and semicolon separators, quoted fields, and Unicode — nothing ever leaves your browser."
    />
    <meta property="og:url" content="https://www.csvjson.com/" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="CSV to JSON Converter — CSVJSON" />
    <meta
      name="twitter:description"
      content="Convert CSV to JSON and JSON to CSV right in your browser. Supports TSV and semicolon separators, quoted fields, and Unicode — nothing ever leaves your browser."
    />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "CSVJSON",
        "url": "https://www.csvjson.com/",
        "applicationCategory": "DeveloperApplication",
        "operatingSystem": "Any",
        "description": "Convert CSV to JSON and JSON to CSV right in your browser. Supports TSV and semicolon separators, quoted fields, and Unicode — nothing ever leaves your browser.",
        "featureList": "CSV to JSON, JSON to CSV, TSV support, drag-and-drop file input, in-browser conversion",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>
    <!-- Analytics, restored for launch (David, 2026-09-01) — supersedes spec
         criterion 8's zero-telemetry decision for analytics only. The Google
         Ads gtag block is the exact tag the legacy site shipped (pre-rebuild
         master abda3770, application/views/page.php). GA4 shares this single
         gtag.js load when VITE_GA4_MEASUREMENT_ID is set at build time (its
         config is added by app/src/analytics); unset means only the Ads
         config ships. The legacy site's dead Universal Analytics ID is gone
         for good — no config call may ever reference it. Plausible runs in
         manual mode (script.manual.js) and counts visits only; the app fires
         its single pageview. -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=AW-831825021"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());
      gtag("config", "AW-831825021");
    </script>
    <!-- Plausible runs in MANUAL mode (script.manual.js): it fires no
         automatic pageview — the app sends exactly one pageview per mount
         (app/src/main.tsx via app/src/analytics). This avoids double-counting
         visits with a fresh mount on a prerendered page. -->
    <script
      defer
      data-domain="csvjson.com"
      src="https://plausible.io/js/script.manual.js"
    ></script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Pre-mount guard: the prerendered markup is static until the bundle
      // takes over, and React's fresh mount below discards whatever is in
      // #root. Keep the shell non-interactive until then so nothing typed
      // into it during the load window can be silently wiped.
      document.getElementById("root").setAttribute("inert", "");
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
