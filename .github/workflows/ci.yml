name: CI

on:
  pull_request:
  push:
    branches: [master, release/rebuild-csvjson-spa]

permissions:
  contents: read


jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # Stale-artifact guard: hash the committed app/dist BEFORE the build
      # regenerates it, so a forgotten rebuild can never ship stale frontend
      # code through the committed-artifact deploy transport.
      - name: Snapshot committed dist hashes
        run: find dist -type f -exec sha256sum {} + | LC_ALL=C sort -k2 > /tmp/dist-committed.sha

      - name: Production build
        run: npm run build  # typecheck step already runs tsc -b; build ends with the prerender step

      - name: Verify committed dist matches the fresh build
        run: |
          find dist -type f -exec sha256sum {} + | LC_ALL=C sort -k2 > /tmp/dist-fresh.sha
          if ! diff -u /tmp/dist-committed.sha /tmp/dist-fresh.sha; then
            echo "::error::Committed app/dist differs from a fresh build — run 'npm run build' locally and commit the updated app/dist"
            exit 1
          fi

      - name: SEO — prerendered index.html carries the on-page targets
        run: bash ../.github/scripts/verify-seo.sh

  shim:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: smoke
          POSTGRES_DB: feedback_smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Lint PHP shim
        run: |
          php -l index.php
          php -l feedback-db.php
          php -l feedback-api.php
          php -l feedback-admin.php


      # Spec criterion 8, amended 2026-09-01 (David): analytics are restored
      # for launch — gtag (the Google Ads conversion tag, restored verbatim
      # from the legacy site, plus an opt-in GA4 config) and Plausible are
      # sanctioned tags now, and the SEO step asserts they ship in the built
      # index.html. The remaining promotional/telemetry remnants stay banned
      # anywhere in the shipped frontend or the PHP shim. Fail on any hit.
      - name: No promotional or telemetry remnants
        run: |
          targets=(index.php .htaccess sitemap.xml robots.txt feedback-db.php feedback-api.php feedback-admin.php app/index.html app/src)
          # Same zero-tolerance rule for surviving webroot image assets:
          # promotional filenames must not ship, even unreferenced.
          if find img -type f 2>/dev/null | grep -iE 'flatfile|obvious|_ad|sponsor'; then
            echo "::error::Promotional image remnant found in img/ (spec criterion 8)"
            exit 1
          fi
          [ -d app/public ] && targets+=(app/public)
          [ -d app/dist ] && targets+=(app/dist)
          # The launch-week feedback banner links to the project's own GitHub
          # discussions (canonical URL: FEEDBACK_DISCUSSION_URL in
          # app/src/components/FeedbackBanner.tsx). Strip that URL from
          # matched lines, then re-grep with the same pattern — whole-line
          # filtering would exempt the entire minified bundle line from the
          # zero-tolerance gate, and a bare non-empty check would false-
          # positive on lines whose only hit was the sanctioned URL.
          # gtag is a sanctioned analytics tag since 2026-09-01 (the restored
          # Google Ads conversion tag), but the DEAD legacy Universal Analytics
          # ID is banned outright — it collects nothing, so any reintroduction
          # is always a bug. Everything else stays banned as before.
          remnant_re='segment|linkedin|carbonads|chikita|flatfile|typekit|putObject|UA-46942708'
          if grep -riE "$remnant_re" "${targets[@]}" \
              | sed 's#github[.]com/FlatFilers/csvjson-app/discussions/163##g' \
              | grep -iE "$remnant_re"; then
            echo "::error::Promotional or telemetry remnant found in the shipped frontend or PHP shim (spec criterion 8)"
            exit 1
          fi

      # Legacy permalinks are read-only (spec: Old share links keep
      # resolving — read-only): no write verbs may ever appear in the SPA.
      - name: No write API usage in the SPA
        run: |
          # The feedback vote widget's fetch is the one sanctioned write (it
          # POSTs /api/feedback): strip the lines carrying that endpoint, then
          # re-grep — same carve-out discipline as the sanctioned banner URL.
          if grep -rniE 'putObject|deleteObject|copyObject|method:\s*["'"'"'](POST|PUT|PATCH|DELETE)["'"'"']' app/src \
              | sed '/\/api\/feedback/d' \
              | grep -iE 'putObject|deleteObject|copyObject|method:\s*["'"'"'](POST|PUT|PATCH|DELETE)["'"'"']'; then
            echo "::error::Write API usage found in app/src — the SPA must be read-only (/api/feedback is the one sanctioned write)"
            exit 1
          fi

      - name: Redirect table, permalinks, and removed endpoints
        run: bash .github/scripts/verify-shim.sh

      # The feedback endpoint is exercised against a real Postgres service
      # container: success paths, every 4xx class, both rate limits, the 503
      # no-database path, admin auth, and the robots.txt disallows.
      - name: Feedback endpoint smoke test (Postgres)
        env:
          DATABASE_URL: postgresql://postgres:smoke@127.0.0.1:5432/feedback_smoke
          FEEDBACK_SALT: ci-smoke-salt-not-a-secret
          ADMIN_TOKEN: ci-smoke-admin-token-not-a-secret
        run: bash scripts/smoke-feedback.sh
