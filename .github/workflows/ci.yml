name: CI

on:
  pull_request:
  push:
    branches: [release/rebuild-csvjson-spa]

permissions:
  contents: read


jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Production build
        run: npx vite build  # typecheck step already runs tsc -b

  shim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Lint PHP shim
        run: php -l index.php


      # Spec criterion 8: no promotional or telemetry remnants anywhere in
      # the shipped frontend or the PHP shim. Fail the build on any hit.
      - name: No promotional or telemetry remnants
        run: |
          targets=(index.php .htaccess sitemap.xml robots.txt app/index.html app/src)
          [ -d app/public ] && targets+=(app/public)
          [ -d app/dist ] && targets+=(app/dist)
          if grep -riE 'segment|gtag|linkedin|carbonads|chikita|flatfile|typekit|putObject' "${targets[@]}"; then
            echo "::error::Promotional or telemetry remnant found in the shipped frontend or PHP shim (spec criterion 8)"
            exit 1
          fi

      - name: Redirect table, permalinks, and removed endpoints
        run: bash .github/scripts/verify-shim.sh
